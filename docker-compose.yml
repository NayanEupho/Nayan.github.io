services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      API_URL: http://backend:3001
    depends_on:
      - backend

  backend:
    build: ./backend
    expose:
      - "3001"
    environment:
      PORT: 3001
      SQLITE_PATH: /data/site.sqlite
      CONTENT_DIR: /content
      PUBLIC_DIR: /public
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
    volumes:
      - sqlite-data:/data
      - ./content:/content
      - ./frontend/public:/public
    depends_on:
      - database

  database:
    build: ./db
    volumes:
      - sqlite-data:/data

volumes:
  sqlite-data:
